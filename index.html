  <style>
:root {
  --bg: #14110e;
  --bg-elev: #1c1814;
  --line: rgba(243, 234, 216, 0.08);
  --text: #f3ead8;
  --muted: #9a8c78;
  --accent: #e0a45a;
  --accent-dim: #b8864a;
  --cell: #2c261f;
  --cell-hi: #3a3229;
  --cell-open: #1a1713;
  --danger: #e07a5f;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --pad: 14px;
  --n1: #7eb8d4;
  --n2: #8fbf7a;
  --n3: #e07a5f;
  --n4: #c9a0dc;
  --n5: #e0a45a;
  --n6: #6ec9c0;
  --n7: #d4c4a8;
  --n8: #8a7c6c;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  padding:
    calc(var(--safe-t) + 8px)
    calc(var(--safe-r) + var(--pad))
    calc(var(--safe-b) + 10px)
    calc(var(--safe-l) + var(--pad));
}

.app {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px 0 10px;
}

.brand {
  font-size: 14px;
  font-weight: 650;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 16px;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.stat:last-of-type { align-items: flex-end; text-align: right; }

.stat-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.stat-value {
  font-variant-numeric: tabular-nums;
  font-size: 22px;
  font-weight: 620;
  line-height: 1.1;
  color: var(--text);
}

.stat-value.warn { color: var(--danger); }

#restart {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(224, 164, 90, 0.35);
  background: radial-gradient(circle at 50% 30%, #2a241e, #1a1713);
  color: var(--accent);
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  appearance: none;
  -webkit-appearance: none;
}

#restart svg { width: 22px; height: 22px; display: block; }

#restart.spin svg { animation: spin 0.45s ease; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}

#restart:active { transform: scale(0.96); }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 10px 0 8px;
}

.segs {
  display: flex;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  min-width: 0;
}

.diff, #flag-btn, #hint-dismiss, #overlay-btn, #stats-btn, #stats-close, #stats-reset, #stats-reset-cancel, #stats-reset-go {
  appearance: none;
  -webkit-appearance: none;
  font: inherit;
  cursor: pointer;
}

.diff {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
}

.diff.on {
  background: var(--accent);
  color: #1a140c;
}

#flag-btn {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 999px;
}

#flag-btn.on {
  background: var(--accent);
  color: #1a140c;
  border-color: transparent;
}

#flag-btn .mini-flag {
  width: 14px;
  height: 14px;
  display: block;
  flex: 0 0 auto;
}

#best {
  font-size: 12px;
  color: var(--muted);
  text-align: right;
  padding: 0 2px 6px;
  font-variant-numeric: tabular-nums;
}

.board-wrap {
  flex: 1;
  min-height: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  display: flex;
  justify-content: safe center;
  align-items: safe center;
  padding-bottom: 8px;
  touch-action: pan-x pan-y;
}

#board {
  --cols: 9;
  --rows: 9;
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  gap: 3px;
  width: min(100%, calc(var(--cols) * 44px));
  min-width: min(100%, calc(var(--cols) * 28px));
  touch-action: manipulation;
}

.cell {
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  margin: 0;
  border-radius: 7px;
  background: linear-gradient(180deg, var(--cell-hi) 0%, var(--cell) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  color: var(--text);
  font: inherit;
  font-weight: 730;
  font-size: clamp(13px, 4.6vw, 18px);
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  -webkit-touch-callout: none;
  user-select: none;
  position: relative;
}

#board[data-difficulty="medium"] .cell,
#board[data-difficulty="hard"] .cell {
  border-radius: 5px;
  font-size: clamp(11px, 3.4vw, 16px);
}

.cell:active:not(.open) {
  filter: brightness(1.12);
}

.cell.open {
  background: var(--cell-open);
  box-shadow: none;
  cursor: default;
}

.cell.open[data-n="1"] { color: var(--n1); }
.cell.open[data-n="2"] { color: var(--n2); }
.cell.open[data-n="3"] { color: var(--n3); }
.cell.open[data-n="4"] { color: var(--n4); }
.cell.open[data-n="5"] { color: var(--n5); }
.cell.open[data-n="6"] { color: var(--n6); }
.cell.open[data-n="7"] { color: var(--n7); }
.cell.open[data-n="8"] { color: var(--n8); }

.cell.flagged { color: var(--accent); }

.flag {
  width: 0.22em;
  height: 0.95em;
  border-radius: 1px;
  background: #f3ead8;
  position: relative;
  display: block;
  margin-left: -0.15em;
}

.flag::after {
  content: "";
  position: absolute;
  left: 0.22em;
  top: 0;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 0.28em 0 0.28em 0.55em;
  border-color: transparent transparent transparent var(--accent);
}

.cell.wrong::before {
  content: "";
  position: absolute;
  inset: 22%;
  border-top: 2px solid var(--danger);
  transform: rotate(45deg);
  transform-origin: center;
  pointer-events: none;
}
.cell.wrong::after {
  content: "";
  position: absolute;
  inset: 22%;
  border-top: 2px solid var(--danger);
  transform: rotate(-45deg);
  pointer-events: none;
}

.ore {
  width: 0.52em;
  height: 0.52em;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f3d7a0, #c47a3a 55%, #3a2a1c 100%);
  box-shadow: 0 0 0 2px #2a2018, 0 0 10px rgba(224, 164, 90, 0.4);
  display: block;
}

.cell.boom {
  background: #4a2218;
  box-shadow: inset 0 0 0 2px var(--accent);
}

.cell.mine.open { background: #241c16; }

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(12, 10, 8, 0.62);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 20;
}

.overlay[hidden] { display: none; }

.card {
  width: min(320px, 100%);
  background: #221c17;
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 28px 22px 22px;
  text-align: center;
}

#overlay-title {
  margin: 0;
  font-size: 28px;
  font-weight: 650;
  letter-spacing: 0.02em;
}

.overlay.win #overlay-title { color: var(--accent); }
.overlay.lose #overlay-title { color: var(--danger); }

#overlay-sub {
  margin: 8px 0 4px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-size: 16px;
}

#overlay-stats {
  margin: 0 0 18px;
  min-height: 1.2em;
  font-size: 14px;
  font-weight: 650;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

#overlay-stats.muted {
  color: var(--muted);
  font-weight: 500;
}

#stats-btn {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.04em;
  padding: 7px 14px;
  border-radius: 999px;
}

#stats-btn:active { transform: scale(0.98); }

.stats-overlay {
  z-index: 30;
  padding:
    calc(var(--safe-t) + 16px)
    calc(var(--safe-r) + 12px)
    calc(var(--safe-b) + 16px)
    calc(var(--safe-l) + 12px);
}

.stats-card {
  width: min(400px, 100%);
  text-align: left;
  padding: 16px 16px 14px;
  max-height: min(86dvh, 720px);
  overflow: auto;
}

.stats-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.stats-head h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: 0.04em;
}

#stats-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--text);
  font-size: 22px;
  line-height: 1;
  padding: 0;
  display: grid;
  place-items: center;
}

.stats-segs {
  width: 100%;
  margin: 0 0 12px;
}

.stats-segs .diff {
  flex: 1 1 0;
  text-align: center;
  padding: 7px 2px;
  font-size: 12px;
  white-space: nowrap;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 0;
}

.stats-grid > div {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  min-width: 0;
}

.stats-grid > div.span { grid-column: 1 / -1; }

.stats-grid dt {
  margin: 0;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.stats-grid dd {
  margin: 3px 0 0;
  font-size: 22px;
  font-weight: 620;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.stats-note {
  margin: 10px 2px 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}

.stats-note[hidden] { display: none; }

.stats-reset { margin-top: 14px; }

#stats-reset {
  width: 100%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
  border-radius: 999px;
  padding: 10px 14px;
}

#stats-confirm {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
}

#stats-confirm[hidden] { display: none; }

#stats-confirm p {
  margin: 0 0 10px;
  color: var(--text);
  font-size: 14px;
  line-height: 1.4;
}

.stats-confirm-row {
  display: flex;
  gap: 8px;
}

#stats-reset-cancel, #stats-reset-go {
  flex: 1;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 12px;
}

#stats-reset-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text);
}

#stats-reset-go {
  border: 0;
  background: var(--danger);
  color: #1a140c;
}

#overlay-btn {
  width: 100%;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #1a140c;
  font-weight: 700;
  font-size: 16px;
  padding: 13px 16px;
}

#overlay-btn:active { transform: scale(0.98); }

#ios-hint {
  margin: 0 0 8px;
  padding: 10px 12px;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

#ios-hint strong { color: var(--text); font-weight: 650; }

#hint-dismiss {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
  margin-left: auto;
}

body.flag-mode .cell:not(.open) { cursor: cell; }

<body>
  <div class="app">
    <header>
      <h1 class="brand">Gray Mines</h1>
      <button type="button" id="stats-btn">Stats</button>
    </header>
    <p id="ios-hint" hidden>
      <span>On your iPhone, tap the <strong>Share</strong> button, then <strong>Add to Home Screen</strong> for a full-screen, offline app. No ads.</span>
      <button type="button" id="hint-dismiss" aria-label="Dismiss">×</button>
    </p>
    <div class="toolbar">
      <div class="stat">
        <span class="stat-label">Left</span>
        <span class="stat-value" id="mines">10</span>
      </div>
      <button type="button" id="restart" aria-label="New game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.2-5.5"/>
          <path d="M20 4v5h-5"/>
        </svg>
      </button>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer">0:00</span>
      </div>
    </div>
    <div class="row">
      <div class="segs" id="diff-segs" role="group" aria-label="Difficulty">
        <button type="button" class="diff" data-diff="easy" aria-pressed="false">Easy</button>
        <button type="button" class="diff" data-diff="medium" aria-pressed="false">Medium</button>
        <button type="button" class="diff" data-diff="hard" aria-pressed="false">Hard</button>
      </div>
      <button type="button" id="flag-btn" aria-pressed="false" aria-label="Flag mode">
        <svg class="mini-flag" viewBox="0 0 16 16" aria-hidden="true">
          <line x1="3.5" y1="1.2" x2="3.5" y2="14.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <polygon points="4.5,1.4 14,4.8 4.5,8.2" fill="currentColor"/>
        </svg>
        Flag
      </button>
    </div>
    <div id="best">Best —</div>
    <div class="board-wrap">
      <div id="board" role="grid" aria-label="Game board"></div>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden>
    <div class="card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-sub"></p>
      <p id="overlay-stats"></p>
      <button type="button" id="overlay-btn">Play again</button>
    </div>
  </div>
  <div id="stats-overlay" class="overlay stats-overlay" hidden>
    <div class="card stats-card" role="dialog" aria-modal="true" aria-labelledby="stats-title">
      <div class="stats-head">
        <h2 id="stats-title">Stats</h2>
        <button type="button" id="stats-close" aria-label="Close">×</button>
      </div>
      <div class="segs stats-segs" role="group" aria-label="Stats difficulty">
        <button type="button" class="diff stats-tab" data-stats="all" aria-pressed="false">All</button>
        <button type="button" class="diff stats-tab" data-stats="easy" aria-pressed="false">Easy</button>
        <button type="button" class="diff stats-tab" data-stats="medium" aria-pressed="false">Medium</button>
        <button type="button" class="diff stats-tab" data-stats="hard" aria-pressed="false">Hard</button>
      </div>
      <dl class="stats-grid" id="stats-grid"></dl>
      <p id="stats-note" class="stats-note" hidden>Best times and the current streak stay with each difficulty. Longest is the highest of those streaks.</p>
      <div class="stats-reset">
        <button type="button" id="stats-reset">Reset stats</button>
        <div id="stats-confirm" hidden>
          <p>Clear every difficulty, including best times?</p>
          <div class="stats-confirm-row">
            <button type="button" id="stats-reset-cancel">Cancel</button>
            <button type="button" id="stats-reset-go">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
/**
 * Gray Mines — core rules (browser + Node).
 * Original implementation; standard grid / number gameplay only.
 */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.GrayMines = factory();
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  const DIFFICULTY = {
    easy: { id: "easy", label: "Easy", rows: 9, cols: 9, mines: 10 },
    medium: { id: "medium", label: "Medium", rows: 16, cols: 16, mines: 40 },
    hard: { id: "hard", label: "Hard", rows: 30, cols: 16, mines: 99 },
  };

  function inBounds(state, r, c) {
    return r >= 0 && c >= 0 && r < state.rows && c < state.cols;
  }

  function neighbors(state, r, c) {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (inBounds(state, nr, nc)) out.push([nr, nc]);
      }
    }
    return out;
  }

  function defaultRng() {
    return Math.random();
  }

  function makeBoard(rows, cols) {
    const board = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) {
        row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
      }
      board.push(row);
    }
    return board;
  }

  function createGame(difficulty, opts) {
    const diff = typeof difficulty === "string" ? DIFFICULTY[difficulty] : difficulty;
    if (!diff) throw new Error("Unknown difficulty");
    const options = opts || {};
    return {
      difficulty: diff.id || "custom",
      rows: diff.rows,
      cols: diff.cols,
      mines: diff.mines,
      board: makeBoard(diff.rows, diff.cols),
      mined: false,
      status: "ready", // ready | playing | won | lost
      flagCount: 0,
      revealedCount: 0,
      startedAt: null,
      endedAt: null,
      rng: options.rng || defaultRng,
      _preplaced: options.mines || null,
    };
  }

  function safeCellsAround(state, r, c, includeSelf) {
    const cells = [];
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!includeSelf && dr === 0 && dc === 0) continue;
        const nr = r + dr, nc = c + dc;
        if (inBounds(state, nr, nc)) cells.push(nr + "," + nc);
      }
    }
    return new Set(cells);
  }

  function computeAdjacents(state) {
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        if (state.board[r][c].mine) {
          state.board[r][c].adjacent = 0;
          continue;
        }
        let n = 0;
        const neigh = neighbors(state, r, c);
        for (let i = 0; i < neigh.length; i++) {
          const cell = state.board[neigh[i][0]][neigh[i][1]];
          if (cell.mine) n++;
        }
        state.board[r][c].adjacent = n;
      }
    }
  }

  function placeMines(state, safeRow, safeCol) {
    if (state.mined) return;
    const total = state.rows * state.cols;
    if (state.mines >= total) throw new Error("Too many mines");

    if (state._preplaced) {
      for (let i = 0; i < state._preplaced.length; i++) {
        const [r, c] = state._preplaced[i];
        if (!inBounds(state, r, c)) throw new Error("Mine out of bounds");
        state.board[r][c].mine = true;
      }
      state.mined = true;
      computeAdjacents(state);
      return;
    }

    // Prefer a fully clear 3x3 around the first tap so it opens an empty area.
    let forbidden = safeCellsAround(state, safeRow, safeCol, true);
    const available = total - forbidden.size;
    if (available < state.mines) {
      forbidden = new Set([safeRow + "," + safeCol]);
    }

    const slots = [];
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        if (!forbidden.has(r + "," + c)) slots.push([r, c]);
      }
    }

    // Fisher–Yates partial shuffle
    const rng = state.rng;
    for (let i = slots.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = slots[i];
      slots[i] = slots[j];
      slots[j] = tmp;
    }
    for (let i = 0; i < state.mines; i++) {
      const [r, c] = slots[i];
      state.board[r][c].mine = true;
    }
    state.mined = true;
    computeAdjacents(state);
  }

  function minesRemaining(state) {
    return state.mines - state.flagCount;
  }

  function checkWin(state) {
    const need = state.rows * state.cols - state.mines;
    return state.revealedCount >= need && state.status !== "lost";
  }

  function finish(state, status) {
    state.status = status;
    state.endedAt = Date.now();
    if (status === "lost") {
      for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
          const cell = state.board[r][c];
          if (cell.mine) cell.revealed = true;
        }
      }
    } else if (status === "won") {
      for (let r = 0; r < state.rows; r++) {
        for (let c = 0; c < state.cols; c++) {
          const cell = state.board[r][c];
          if (cell.mine && !cell.flagged) {
            cell.flagged = true;
            state.flagCount++;
          }
        }
      }
    }
  }

  function floodReveal(state, startR, startC) {
    const stack = [[startR, startC]];
    const newly = [];
    while (stack.length) {
      const [r, c] = stack.pop();
      if (!inBounds(state, r, c)) continue;
      const cell = state.board[r][c];
      if (cell.revealed || cell.flagged || cell.mine) continue;
      cell.revealed = true;
      state.revealedCount++;
      newly.push([r, c]);
      if (cell.adjacent === 0) {
        const neigh = neighbors(state, r, c);
        for (let i = 0; i < neigh.length; i++) stack.push(neigh[i]);
      }
    }
    return newly;
  }

  function reveal(state, r, c) {
    if (state.status === "won" || state.status === "lost") {
      return { ok: false, reason: "ended" };
    }
    if (!inBounds(state, r, c)) return { ok: false, reason: "oob" };
    const cell = state.board[r][c];
    if (cell.revealed) return { ok: false, reason: "revealed" };
    if (cell.flagged) return { ok: false, reason: "flagged" };

    if (!state.mined) {
      placeMines(state, r, c);
    }
    if (state.status === "ready") {
      state.status = "playing";
      state.startedAt = Date.now();
    }

    if (cell.mine) {
      cell.revealed = true;
      cell.exploded = true;
      finish(state, "lost");
      return { ok: true, hitMine: true, opened: [[r, c]] };
    }

    const opened = floodReveal(state, r, c);
    if (checkWin(state)) finish(state, "won");
    return { ok: true, hitMine: false, opened, status: state.status };
  }

  function toggleFlag(state, r, c) {
    if (state.status === "won" || state.status === "lost") {
      return { ok: false, reason: "ended" };
    }
    if (!inBounds(state, r, c)) return { ok: false, reason: "oob" };
    const cell = state.board[r][c];
    if (cell.revealed) return { ok: false, reason: "revealed" };
    cell.flagged = !cell.flagged;
    state.flagCount += cell.flagged ? 1 : -1;
    if (state.status === "ready") {
      // Flagging before the first reveal shouldn't start the clock.
    }
    return { ok: true, flagged: cell.flagged, flagCount: state.flagCount };
  }

  function chord(state, r, c) {
    if (state.status === "won" || state.status === "lost") {
      return { ok: false, reason: "ended" };
    }
    if (!inBounds(state, r, c)) return { ok: false, reason: "oob" };
    const cell = state.board[r][c];
    if (!cell.revealed || cell.mine) return { ok: false, reason: "not-numbered" };
    if (cell.adjacent === 0) return { ok: false, reason: "zero" };

    const neigh = neighbors(state, r, c);
    let flags = 0;
    for (let i = 0; i < neigh.length; i++) {
      if (state.board[neigh[i][0]][neigh[i][1]].flagged) flags++;
    }
    if (flags !== cell.adjacent) {
      return { ok: false, reason: "unsatisfied", flags, adjacent: cell.adjacent };
    }

    const opened = [];
    let hitMine = false;
    for (let i = 0; i < neigh.length; i++) {
      const [nr, nc] = neigh[i];
      const ncell = state.board[nr][nc];
      if (ncell.flagged || ncell.revealed) continue;
      const result = reveal(state, nr, nc);
      if (result.ok && result.opened) {
        for (let j = 0; j < result.opened.length; j++) opened.push(result.opened[j]);
      }
      if (result.hitMine) {
        hitMine = true;
        break;
      }
    }
    return { ok: true, hitMine, opened, status: state.status };
  }

  function elapsedSeconds(state, now) {
    if (!state.startedAt) return 0;
    const end = state.endedAt || now || Date.now();
    return Math.floor((end - state.startedAt) / 1000);
  }

  function countMines(state) {
    let n = 0;
    for (let r = 0; r < state.rows; r++) {
      for (let c = 0; c < state.cols; c++) {
        if (state.board[r][c].mine) n++;
      }
    }
    return n;
  }

  const STORAGE_KEY = "graymines-best";
  const STATS_KEY = "graymines-stats";
  const STAT_IDS = ["easy", "medium", "hard"];

  function storageOf(storage) {
    if (storage) return storage;
    try {
      if (typeof localStorage !== "undefined" && localStorage) return localStorage;
    } catch (e) { /* private mode */ }
    return null;
  }

  function blankBucket() {
    return { played: 0, won: 0, best: null, winTimeSum: 0, streak: 0, bestStreak: 0 };
  }

  function emptyStats() {
    return { easy: blankBucket(), medium: blankBucket(), hard: blankBucket() };
  }

  function nonnegInt(value) {
    if (typeof value !== "number" || !isFinite(value) || value < 0) return 0;
    return Math.floor(value);
  }

  function asSeconds(value) {
    return nonnegInt(value);
  }

  function sanitizeBucket(raw) {
    const bucket = blankBucket();
    if (!raw || typeof raw !== "object") return bucket;
    bucket.played = nonnegInt(raw.played);
    bucket.won = Math.min(nonnegInt(raw.won), bucket.played);
    bucket.best = (typeof raw.best === "number" && isFinite(raw.best) && raw.best >= 0)
      ? Math.floor(raw.best)
      : null;
    bucket.winTimeSum = bucket.won ? nonnegInt(raw.winTimeSum) : 0;
    bucket.streak = nonnegInt(raw.streak);
    bucket.bestStreak = Math.max(nonnegInt(raw.bestStreak), bucket.streak);
    return bucket;
  }

  function bestsOf(stats) {
    return {
      easy: stats.easy.best,
      medium: stats.medium.best,
      hard: stats.hard.best,
    };
  }

  function readLegacyBests(store) {
    const bests = { easy: null, medium: null, hard: null };
    if (!store) return bests;
    try {
      const raw = store.getItem(STORAGE_KEY);
      if (!raw) return bests;
      const data = JSON.parse(raw);
      for (let i = 0; i < STAT_IDS.length; i++) {
        const id = STAT_IDS[i];
        const value = data && data[id];
        if (typeof value === "number" && isFinite(value) && value >= 0) bests[id] = Math.floor(value);
      }
    } catch (e) { /* ignore corrupt legacy */ }
    return bests;
  }

  function writeAll(store, stats) {
    if (!store) return;
    try {
      store.setItem(STATS_KEY, JSON.stringify(stats));
      store.setItem(STORAGE_KEY, JSON.stringify(bestsOf(stats)));
    } catch (e) { /* private mode */ }
  }

  function loadStats(storage) {
    const store = storageOf(storage);
    const stats = emptyStats();
    let hadStats = false;
    if (store) {
      try {
        const raw = store.getItem(STATS_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          if (data && typeof data === "object") {
            for (let i = 0; i < STAT_IDS.length; i++) {
              stats[STAT_IDS[i]] = sanitizeBucket(data[STAT_IDS[i]]);
            }
            hadStats = true;
          }
        }
      } catch (e) { /* corrupt stats; fall through to legacy bests */ }
    }
    const legacy = readLegacyBests(store);
    let changed = !hadStats;
    for (let i = 0; i < STAT_IDS.length; i++) {
      const id = STAT_IDS[i];
      const previous = legacy[id];
      if (previous == null) continue;
      if (stats[id].best == null || previous < stats[id].best) {
        stats[id].best = previous;
        changed = true;
      }
    }
    if (changed) writeAll(store, stats);
    return stats;
  }

  function loadBests(storage) {
    return bestsOf(loadStats(storage));
  }

  function saveBest(difficulty, seconds, storage) {
    const stats = loadStats(storage);
    const bests = bestsOf(stats);
    if (!stats[difficulty]) return { record: false, bests: bests };
    const secs = asSeconds(seconds);
    const prev = stats[difficulty].best;
    if (prev == null || secs < prev) {
      stats[difficulty].best = secs;
      writeAll(storageOf(storage), stats);
      return { record: true, bests: bestsOf(stats) };
    }
    return { record: false, bests: bests };
  }

  function summarize(bucket) {
    const played = bucket.played;
    const won = bucket.won;
    return {
      played: played,
      won: won,
      winPct: played ? Math.round((won / played) * 100) : null,
      best: bucket.best,
      avgWin: won ? Math.round(bucket.winTimeSum / won) : null,
      streak: bucket.streak,
      bestStreak: bucket.bestStreak,
    };
  }

  function summarizeAll(stats) {
    let played = 0;
    let won = 0;
    let winTimeSum = 0;
    let bestStreak = 0;
    for (let i = 0; i < STAT_IDS.length; i++) {
      const bucket = stats[STAT_IDS[i]];
      played += bucket.played;
      won += bucket.won;
      winTimeSum += bucket.winTimeSum;
      if (bucket.bestStreak > bestStreak) bestStreak = bucket.bestStreak;
    }
    return {
      played: played,
      won: won,
      winPct: played ? Math.round((won / played) * 100) : null,
      best: null,
      avgWin: won ? Math.round(winTimeSum / won) : null,
      streak: null,
      bestStreak: bestStreak,
    };
  }

  // A board counts only after the first reveal. Leaving a ready board
  // (including one that was only flagged) is not a game. Leaving mid-play
  // is a loss. Finished games are already recorded.
  function leaveOutcome(state) {
    if (!state || state.status !== "playing") return null;
    return { won: false, seconds: elapsedSeconds(state) };
  }

  function recordResult(storage, difficulty, outcome) {
    if (!DIFFICULTY[difficulty]) throw new Error("Unknown difficulty");
    const stats = loadStats(storage);
    const bucket = stats[difficulty];
    const won = !!(outcome && outcome.won);
    const seconds = asSeconds(outcome && outcome.seconds);
    const previousStreak = bucket.streak;
    bucket.played += 1;
    let record = false;
    if (won) {
      bucket.won += 1;
      bucket.winTimeSum += seconds;
      bucket.streak += 1;
      if (bucket.streak > bucket.bestStreak) bucket.bestStreak = bucket.streak;
      if (bucket.best == null || seconds < bucket.best) {
        bucket.best = seconds;
        record = true;
      }
    } else {
      bucket.streak = 0;
    }
    writeAll(storageOf(storage), stats);
    return {
      record: record,
      streak: bucket.streak,
      bestStreak: bucket.bestStreak,
      previousStreak: previousStreak,
      endedStreak: !won && previousStreak > 0,
      summary: summarize(bucket),
      stats: stats,
    };
  }

  function resetStats(storage) {
    const stats = emptyStats();
    writeAll(storageOf(storage), stats);
    return stats;
  }

  return {
    DIFFICULTY,
    STORAGE_KEY,
    STATS_KEY,
    createGame,
    placeMines,
    computeAdjacents,
    neighbors,
    inBounds,
    reveal,
    toggleFlag,
    chord,
    minesRemaining,
    checkWin,
    elapsedSeconds,
    countMines,
    loadBests,
    saveBest,
    loadStats,
    recordResult,
    resetStats,
    summarize,
    summarizeAll,
    leaveOutcome,
  };
});

  </script>
  <script>
(function () {
  "use strict";
  const G = window.GrayMines;
  const LONG_MS = 350;
  const MOVE_CANCEL_PX = 14;

  const $ = (sel) => document.querySelector(sel);
  const boardEl = $("#board");
  const minesEl = $("#mines");
  const timerEl = $("#timer");
  const bestEl = $("#best");
  const restartEl = $("#restart");
  const flagBtn = $("#flag-btn");
  const overlay = $("#overlay");
  const overlayTitle = $("#overlay-title");
  const overlaySub = $("#overlay-sub");
  const overlayStats = $("#overlay-stats");
  const overlayBtn = $("#overlay-btn");
  const hintEl = $("#ios-hint");
  const hintDismiss = $("#hint-dismiss");
  const statsBtn = $("#stats-btn");
  const statsOverlay = $("#stats-overlay");
  const statsClose = $("#stats-close");
  const statsGrid = $("#stats-grid");
  const statsNote = $("#stats-note");
  const statsReset = $("#stats-reset");
  const statsConfirm = $("#stats-confirm");
  const statsResetCancel = $("#stats-reset-cancel");
  const statsResetGo = $("#stats-reset-go");

  let game = null;
  let difficulty = "easy";
  let flagMode = false;
  let timerId = null;
  let cells = []; // [r][c] -> button
  let statsView = "easy";

  function formatTime(s) {
    s = Math.max(0, s | 0);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ":" + String(sec).padStart(2, "0");
  }

  function isStandalone() {
    return (
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches
    );
  }

  function loadDifficulty() {
    try {
      const d = localStorage.getItem("graymines-difficulty");
      if (d && G.DIFFICULTY[d]) return d;
    } catch (e) { /* ignore */ }
    return "easy";
  }

  function saveDifficulty(d) {
    try { localStorage.setItem("graymines-difficulty", d); } catch (e) { /* ignore */ }
  }

  function updateBestLabel() {
    const bests = G.loadBests();
    const v = bests[difficulty];
    bestEl.textContent = v == null ? "Best —" : "Best " + formatTime(v);
  }

  function updateHUD() {
    if (!game) return;
    const remaining = G.minesRemaining(game);
    minesEl.textContent = String(remaining);
    minesEl.classList.toggle("warn", remaining < 0);
    timerEl.textContent = formatTime(G.elapsedSeconds(game));
  }

  function startTimer() {
    stopTimer();
    timerId = setInterval(updateHUD, 200);
  }

  function stopTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function paintCell(r, c) {
    const el = cells[r][c];
    const cell = game.board[r][c];
    el.className = "cell";
    el.textContent = "";
    el.removeAttribute("data-n");
    el.setAttribute("aria-label", "hidden");
    if (cell.flagged && !(game.status === "lost" && cell.mine && cell.revealed && !cell.exploded)) {
      el.classList.add("flagged");
      el.setAttribute("aria-label", "flagged");
      el.innerHTML = '<span class="flag" aria-hidden="true"></span>';
      if (game.status === "lost" && !cell.mine) {
        el.classList.add("wrong");
        el.setAttribute("aria-label", "wrong flag");
      }
      return;
    }
    if (!cell.revealed) {
      return;
    }
    el.classList.add("open");
    if (cell.mine) {
      el.classList.add(cell.exploded ? "boom" : "mine");
      el.innerHTML = '<span class="ore" aria-hidden="true"></span>';
      el.setAttribute("aria-label", "mine");
      return;
    }
    if (cell.adjacent > 0) {
      el.dataset.n = String(cell.adjacent);
      el.textContent = String(cell.adjacent);
      el.setAttribute("aria-label", cell.adjacent + " nearby");
    } else {
      el.setAttribute("aria-label", "empty");
    }
  }

  function paintAll() {
    for (let r = 0; r < game.rows; r++) {
      for (let c = 0; c < game.cols; c++) paintCell(r, c);
    }
    updateHUD();
  }

  function finishSummary(result, won) {
    if (won) {
      return result.record
        ? "New best!  ·  Streak " + result.streak
        : "Streak " + result.streak;
    }
    return result.endedStreak ? "Streak ended" : "Streak 0";
  }

  function recordFinish() {
    if (game.statsResult) return game.statsResult;
    const won = game.status === "won";
    const result = G.recordResult(null, difficulty, {
      won: won,
      seconds: G.elapsedSeconds(game),
    });
    game.statsRecorded = true;
    game.statsResult = result;
    return result;
  }

  function showEnd() {
    stopTimer();
    updateHUD();
    paintAll();
    const won = game.status === "won";
    const result = recordFinish();
    overlay.hidden = false;
    overlaySub.textContent = formatTime(G.elapsedSeconds(game));
    overlayStats.textContent = finishSummary(result, won);
    overlayStats.classList.toggle("muted", !won);
    if (won) {
      overlayTitle.textContent = "Clear";
      overlayBtn.textContent = "Play again";
      overlay.classList.add("win");
      overlay.classList.remove("lose");
      updateBestLabel();
    } else {
      overlayTitle.textContent = "Mine tripped";
      overlayBtn.textContent = "Try again";
      overlay.classList.add("lose");
      overlay.classList.remove("win");
    }
  }

  function applyResult(res) {
    if (!res || !res.ok) {
      updateHUD();
      return;
    }
    if (game.status === "playing" && !timerId) startTimer();
    if (res.opened) {
      for (let i = 0; i < res.opened.length; i++) {
        paintCell(res.opened[i][0], res.opened[i][1]);
      }
    } else {
      paintAll();
    }
    updateHUD();
    if (game.status === "won" || game.status === "lost") showEnd();
  }

  function onReveal(r, c) {
    const cell = game.board[r][c];
    if (cell.revealed && cell.adjacent > 0) {
      applyResult(G.chord(game, r, c));
      // chord may open many cells; safest to refresh opened + neighbors
      if (game.status !== "ready") paintAll();
      if (game.status === "won" || game.status === "lost") showEnd();
      return;
    }
    applyResult(G.reveal(game, r, c));
  }

  function onFlag(r, c) {
    const res = G.toggleFlag(game, r, c);
    if (res.ok) {
      paintCell(r, c);
      updateHUD();
      try {
        if (navigator.vibrate) navigator.vibrate(15);
      } catch (e) { /* unsupported */ }
    }
  }

  function bindCell(btn, r, c) {
    let timer = null;
    let longFired = false;
    let sx = 0, sy = 0;
    let pointerId = null;

    function clear() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
    }

    btn.addEventListener("pointerdown", (e) => {
      if (e.button != null && e.button !== 0) return;
      pointerId = e.pointerId;
      longFired = false;
      sx = e.clientX;
      sy = e.clientY;
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* old safari */ }
      clear();
      timer = setTimeout(() => {
        timer = null;
        longFired = true;
        if (!flagMode) onFlag(r, c);
      }, LONG_MS);
    });

    btn.addEventListener("pointermove", (e) => {
      if (pointerId == null) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (dx * dx + dy * dy > MOVE_CANCEL_PX * MOVE_CANCEL_PX) clear();
    });

    function endPress(e) {
      if (pointerId == null) return;
      const wasLong = longFired;
      const hadTimer = !!timer;
      clear();
      pointerId = null;
      if (e && e.type === "pointercancel") return;
      if (wasLong) return; // already flagged
      if (!hadTimer && !wasLong) {
        // cancelled by move
      }
      // If timer was cleared by move, hadTimer is false and longFired is false — treat as cancel if moved
      if (e) {
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (dx * dx + dy * dy > MOVE_CANCEL_PX * MOVE_CANCEL_PX) return;
      }
      if (flagMode) onFlag(r, c);
      else onReveal(r, c);
    }

    btn.addEventListener("pointerup", endPress);
    btn.addEventListener("pointercancel", () => {
      clear();
      pointerId = null;
    });

    btn.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      onFlag(r, c);
    });
  }

  function buildBoard() {
    boardEl.innerHTML = "";
    boardEl.style.setProperty("--cols", String(game.cols));
    boardEl.style.setProperty("--rows", String(game.rows));
    boardEl.dataset.difficulty = difficulty;
    cells = [];
    const frag = document.createDocumentFragment();
    for (let r = 0; r < game.rows; r++) {
      cells[r] = [];
      for (let c = 0; c < game.cols; c++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        btn.dataset.r = String(r);
        btn.dataset.c = String(c);
        bindCell(btn, r, c);
        cells[r][c] = btn;
        frag.appendChild(btn);
      }
    }
    boardEl.appendChild(frag);
  }

  function settleOpenGame() {
    if (!game || game.statsRecorded) return;
    const outcome = G.leaveOutcome(game);
    if (!outcome) return;
    G.recordResult(null, difficulty, outcome);
    game.statsRecorded = true;
  }

  function newGame(diff) {
    settleOpenGame();
    if (diff) difficulty = diff;
    saveDifficulty(difficulty);
    stopTimer();
    overlay.hidden = true;
    overlay.classList.remove("win", "lose");
    game = G.createGame(difficulty);
    document.querySelectorAll("#diff-segs .diff").forEach((b) => {
      b.classList.toggle("on", b.dataset.diff === difficulty);
      b.setAttribute("aria-pressed", b.dataset.diff === difficulty ? "true" : "false");
    });
    buildBoard();
    updateHUD();
    updateBestLabel();
    restartEl.classList.remove("spin");
    void restartEl.offsetWidth;
    restartEl.classList.add("spin");
  }

  function setFlagMode(on) {
    flagMode = on;
    flagBtn.classList.toggle("on", on);
    flagBtn.setAttribute("aria-pressed", on ? "true" : "false");
    document.body.classList.toggle("flag-mode", on);
  }

  function dash(value) {
    return value == null ? "—" : String(value);
  }

  function hideStatsConfirm() {
    statsConfirm.hidden = true;
    statsReset.hidden = false;
  }

  function renderStats() {
    document.querySelectorAll(".stats-tab").forEach((b) => {
      const on = b.dataset.stats === statsView;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const stats = G.loadStats();
    const summary = statsView === "all" ? G.summarizeAll(stats) : G.summarize(stats[statsView]);
    const rows = [
      ["Played", String(summary.played)],
      ["Won", String(summary.won)],
      ["Win %", summary.winPct == null ? "—" : summary.winPct + "%"],
      ["Best", summary.best == null ? "—" : formatTime(summary.best)],
      ["Avg win", summary.avgWin == null ? "—" : formatTime(summary.avgWin)],
      ["Streak", dash(summary.streak)],
      ["Longest", String(summary.bestStreak)],
    ];
    statsGrid.innerHTML = "";
    for (let i = 0; i < rows.length; i++) {
      const wrap = document.createElement("div");
      if (i === rows.length - 1) wrap.className = "span";
      const dt = document.createElement("dt");
      dt.textContent = rows[i][0];
      const dd = document.createElement("dd");
      dd.textContent = rows[i][1];
      wrap.appendChild(dt);
      wrap.appendChild(dd);
      statsGrid.appendChild(wrap);
    }
    statsNote.hidden = statsView !== "all";
  }

  function openStats() {
    statsView = difficulty;
    hideStatsConfirm();
    renderStats();
    statsOverlay.hidden = false;
    statsClose.focus();
  }

  function closeStats() {
    statsOverlay.hidden = true;
    hideStatsConfirm();
    statsBtn.focus();
  }

  flagBtn.addEventListener("click", () => setFlagMode(!flagMode));
  restartEl.addEventListener("click", () => newGame());
  overlayBtn.addEventListener("click", () => newGame());
  statsBtn.addEventListener("click", openStats);
  statsClose.addEventListener("click", closeStats);
  statsOverlay.addEventListener("click", (e) => {
    if (e.target === statsOverlay) closeStats();
  });
  document.querySelectorAll(".stats-tab").forEach((b) => {
    b.addEventListener("click", () => {
      statsView = b.dataset.stats;
      hideStatsConfirm();
      renderStats();
    });
  });
  statsReset.addEventListener("click", () => {
    statsReset.hidden = true;
    statsConfirm.hidden = false;
    statsResetGo.focus();
  });
  statsResetCancel.addEventListener("click", hideStatsConfirm);
  statsResetGo.addEventListener("click", () => {
    G.resetStats();
    hideStatsConfirm();
    updateBestLabel();
    renderStats();
  });

  document.querySelectorAll("#diff-segs .diff").forEach((b) => {
    b.addEventListener("click", () => newGame(b.dataset.diff));
  });

  document.addEventListener("keydown", (e) => {
    if (!statsOverlay.hidden) {
      if (e.key === "Escape") closeStats();
      return;
    }
    if (e.key === "f" || e.key === "F") {
      setFlagMode(!flagMode);
    } else if (e.key === "r" || e.key === "R") {
      newGame();
    } else if (e.key === "Escape") {
      if (!overlay.hidden) newGame();
    }
  });

  // iOS add-to-home-screen hint, once
  try {
    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const dismissed = localStorage.getItem("graymines-hint-dismissed") === "1";
    if (isiOS && !isStandalone() && !dismissed) {
      hintEl.hidden = false;
    }
  } catch (e) { /* ignore */ }

  hintDismiss.addEventListener("click", () => {
    hintEl.hidden = true;
    try { localStorage.setItem("graymines-hint-dismissed", "1"); } catch (e) { /* ignore */ }
  });

  if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => { /* offline */ });
    }).catch(() => { /* offline file or missing sw */ });
  }

  difficulty = loadDifficulty();
  newGame(difficulty);
})();

  </script>
